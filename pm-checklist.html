<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  #status {
    font-size: 12px;
    margin-bottom: 8px;
  }

  #refreshButton {
    padding: 7px 12px;
    margin-bottom: 10px;
    cursor: pointer;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 4px;
  }

  .title {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 8px;
  }

  .task {
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
  }

  .task-text {
    margin-bottom: 7px;
  }

  .options {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .options label {
    cursor: pointer;
  }

  .options input {
    margin-right: 4px;
  }

  .fail {
    font-weight: bold;
  }
</style>
</head>

<body>

<div id="status">Loading PM checklist...</div>

<button id="refreshButton" type="button">
  Refresh Checklist
</button>

<div id="checklist"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbwAitSILQYvKP-YgSvCUj8bIWel_07hIO7b8PGj9qo-DW6eRzOGVRVDy8w8rzZEbOEg8w/exec";

let currentAssetId = "";
let currentTasks = [];
let existingResultsText = "";
let hasInteraction = false;


function jsonp(params, callbackName) {
  const script =
    document.createElement("script");

  params.callback =
    callbackName;

  script.src =
    API + "?" +
    new URLSearchParams(params);

  document.body.appendChild(script);
}


function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function getReturnedValue(data, qid) {

  if (
    data === null ||
    data === undefined
  ) {
    return "";
  }

  if (
    typeof data === "string" ||
    typeof data === "number"
  ) {
    return String(data);
  }

  if (Array.isArray(data)) {

    if (!data.length) return "";

    return getReturnedValue(
      data[0],
      qid
    );
  }

  if (typeof data === "object") {

    if (data.value !== undefined) {
      return String(
        data.value || ""
      );
    }

    if (data.answer !== undefined) {
      return String(
        data.answer || ""
      );
    }

    if (
      data[qid] !== undefined
    ) {
      return getReturnedValue(
        data[qid],
        qid
      );
    }

    if (
      data["input_" + qid] !==
      undefined
    ) {
      return getReturnedValue(
        data["input_" + qid],
        qid
      );
    }

    const keys =
      Object.keys(data);

    if (keys.length === 1) {
      return getReturnedValue(
        data[keys[0]],
        qid
      );
    }
  }

  return "";
}


function parseExistingResults(text) {

  const results = {};

  String(text || "")
    .split(/\r?\n/)
    .forEach(function(line) {

      const match =
        line.match(
          /^(PASS|FAIL|N\/A)\s+-\s+(.+)$/i
        );

      if (match) {

        results[
          match[2].trim()
        ] =
          match[1].toUpperCase();
      }
    });

  return results;
}


function buildResultsText() {

  if (!currentTasks.length) {
    return "";
  }

  return currentTasks
    .map(function(task, index) {

      const selected =
        document.querySelector(
          'input[name="pm_task_' +
          index +
          '"]:checked'
        );

      const result =
        selected
          ? selected.value
          : "NOT ANSWERED";

      return (
        result +
        " - " +
        task
      );
    })
    .join("\n");
}


function saveResults() {

  if (!currentTasks.length) {
    return;
  }

  const value =
    buildResultsText();

  existingResultsText =
    value;

  JFCustomWidget.setFieldsValueByLabel([
    {
      label:
        "PM Checklist Results",
      value:
        value
    }
  ]);

  JFCustomWidget.sendData({
    value:
      value
  });
}


function resizeWidget() {

  const height =
    Math.max(
      150,
      document.body.scrollHeight +
      20
    );

  JFCustomWidget.requestFrameResize({
    height:
      height
  });
}


function renderChecklist(asset) {

  const container =
    document.getElementById(
      "checklist"
    );

  const status =
    document.getElementById(
      "status"
    );

  if (!asset) {

    currentTasks = [];

    container.innerHTML = "";

    status.textContent =
      "Asset not found.";

    resizeWidget();

    return;
  }


  const checklistText =
    String(
      asset.pmChecklist || ""
    ).trim();


  let tasks =
    checklistText
      ? checklistText.split(
          /\r?\n/
        )
      : [
          asset.description ||
          asset.assetName ||
          "PM Task"
        ];


  tasks =
    tasks
      .map(function(task) {
        return task.trim();
      })
      .filter(Boolean);


  currentTasks =
    tasks;


  const previous =
    parseExistingResults(
      existingResultsText
    );


  let html =
    '<div class="title">' +
    'PM Checklist' +
    '</div>';


  tasks.forEach(
    function(task, index) {

      const prior =
        previous[task] || "";

      html +=
        '<div class="task">' +

          '<div class="task-text">' +
            escapeHtml(task) +
          '</div>' +

          '<div class="options">' +

            '<label>' +
              '<input type="radio" ' +
              'name="pm_task_' +
              index +
              '" value="PASS"' +
              (
                prior === "PASS"
                  ? ' checked'
                  : ''
              ) +
              '>' +
              'Pass' +
            '</label>' +

            '<label class="fail">' +
              '<input type="radio" ' +
              'name="pm_task_' +
              index +
              '" value="FAIL"' +
              (
                prior === "FAIL"
                  ? ' checked'
                  : ''
              ) +
              '>' +
              'Fail' +
            '</label>' +

            '<label>' +
              '<input type="radio" ' +
              'name="pm_task_' +
              index +
              '" value="N/A"' +
              (
                prior === "N/A"
                  ? ' checked'
                  : ''
              ) +
              '>' +
              'N/A' +
            '</label>' +

          '</div>' +

        '</div>';
    }
  );


  container.innerHTML =
    html;


  container
    .querySelectorAll(
      'input[type="radio"]'
    )
    .forEach(
      function(input) {

        input.addEventListener(
          "change",
          function() {

            hasInteraction =
              true;

            saveResults();
          }
        );
      }
    );


  status.textContent =
    "Asset: " +
    (
      asset.assetName ||
      currentAssetId
    );


  resizeWidget();
}


window.pmAssetDetailsCallback =
function(asset) {

  renderChecklist(asset);
};


function loadChecklist() {

  const status =
    document.getElementById(
      "status"
    );

  const container =
    document.getElementById(
      "checklist"
    );

  status.textContent =
    "Loading PM checklist...";

  container.innerHTML =
    "";

  currentTasks =
    [];


  JFCustomWidget.getFieldsValueById(
    ["input_25"]
    function(assetData) {

      currentAssetId =
        getReturnedValue(
          assetData,
          "25"
        ).trim();


      JFCustomWidget.getFieldsValueById(
     ["input_52"],
        function(resultData) {

          existingResultsText =
            getReturnedValue(
              resultData,
              "52"
            ).trim();


          if (
            !currentAssetId ||
            currentAssetId
              .toLowerCase() ===
              "not assigned"
          ) {

            status.textContent =
              "No asset assigned — no PM checklist.";

            container.innerHTML =
              "";

            resizeWidget();

            return;
          }


          jsonp(
            {
              action:
                "assetDetails",

              asset:
                currentAssetId
            },
            "pmAssetDetailsCallback"
          );
        }
      );
    }
  );
}


JFCustomWidget.subscribe(
  "ready",
  function() {

    document
      .getElementById(
        "refreshButton"
      )
      .addEventListener(
        "click",
        loadChecklist
      );


    loadChecklist();


    JFCustomWidget.subscribe(
      "submit",
      function() {

        let value =
          existingResultsText ||
          "";


        if (hasInteraction) {

          value =
            buildResultsText();

          saveResults();
        }


        JFCustomWidget.sendSubmit({
          valid:
            true,

          value:
            value
        });
      }
    );
  }
);

</script>

</body>
</html>
