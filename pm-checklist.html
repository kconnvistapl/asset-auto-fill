<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #222;
  }

  .task {
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
  }

  .task-text {
    font-weight: 600;
    margin-bottom: 7px;
  }

  .options {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .options label {
    cursor: pointer;
    font-size: 14px;
  }

  .options input {
    margin-right: 5px;
  }

  #status {
    font-size: 12px;
    margin-top: 8px;
  }

  #error {
    color: #b00020;
    font-size: 13px;
    margin-top: 8px;
    font-weight: 600;
  }

  .note {
    font-size: 13px;
    color: #555;
    padding: 6px 0;
  }
</style>
</head>

<body>

<div id="checklist"></div>
<div id="status"></div>
<div id="error"></div>

<script>

let tasks = [];
let frequency = "";
let savedResults = {};

function cleanTask(text) {
  return String(text || "")
    .trim()
    .replace(/^[-•]\s*/, "")
    .replace(/^\d+[.)]\s*/, "")
    .trim();
}

function parseSaved(value) {

  const map = {};

  String(value || "")
    .split(/\r?\n/)
    .forEach(function(line) {

      const match =
        line.match(
          /^(PASS|FAIL|N\/A)\s+-\s+(.*)$/i
        );

      if (match) {
        map[match[2].trim()] =
          match[1].toUpperCase();
      }

    });

  return map;
}

function fieldValue(result, qid) {

  const containers = [
    result,
    result && result.data
  ];

  const candidates = [
    qid,
    "input_" + qid,
    "q" + qid
  ];

  function unwrap(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    if (
      typeof value === "string" ||
      typeof value === "number"
    ) {
      return String(value);
    }

    if (typeof value === "object") {

      if (value.value !== undefined) {
        return unwrap(value.value);
      }

      if (value.answer !== undefined) {
        return unwrap(value.answer);
      }
    }

    return "";
  }

  for (
    let i = 0;
    i < containers.length;
    i++
  ) {

    const container =
      containers[i];

    if (!container) continue;

    if (Array.isArray(container)) {

      for (
        let j = 0;
        j < container.length;
        j++
      ) {

        const item =
          container[j] || {};

        const id =
          String(
            item.id ||
            item.qid ||
            item.name ||
            item.input ||
            ""
          );

        if (
          id === qid ||
          id === "input_" + qid ||
          id === "q" + qid
        ) {

          const found =
            unwrap(item);

          if (found !== "") {
            return found;
          }
        }
      }

    } else {

      for (
        let k = 0;
        k < candidates.length;
        k++
      ) {

        const key =
          candidates[k];

        if (
          Object.prototype.hasOwnProperty.call(
            container,
            key
          )
        ) {

          const found =
            unwrap(container[key]);

          if (found !== "") {
            return found;
          }
        }
      }
    }
  }

  return "";
}

function resultText() {

  return tasks
    .map(function(task, index) {

      const selected =
        document.querySelector(
          'input[name="pm_' +
          index +
          '"]:checked'
        );

      return (
        selected
          ? selected.value
          : "NOT ANSWERED"
      ) +
      " - " +
      task;

    })
    .join("\n");
}

function render() {

  const checklist =
    document.getElementById(
      "checklist"
    );

  const status =
    document.getElementById(
      "status"
    );

  const error =
    document.getElementById(
      "error"
    );

  error.textContent = "";
  checklist.innerHTML = "";

  if (
    frequency
      .trim()
      .toLowerCase() ===
    "immediate wo"
  ) {

    tasks = [];

    checklist.innerHTML =
      '<div class="note">' +
      'PM checklist not required for Immediate WO.' +
      '</div>';

    status.textContent = "";

    return;
  }

  if (!tasks.length) {

    checklist.innerHTML =
      '<div class="note">' +
      'No PM tasks found in Description of Work Needed.' +
      '</div>';

    status.textContent = "";

    return;
  }

  tasks.forEach(
    function(task, index) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "task";

      const text =
        document.createElement(
          "div"
        );

      text.className =
        "task-text";

      text.textContent =
        task;

      row.appendChild(
        text
      );

      const options =
        document.createElement(
          "div"
        );

      options.className =
        "options";

      [
        "PASS",
        "FAIL",
        "N/A"
      ].forEach(
        function(value) {

          const label =
            document.createElement(
              "label"
            );

          const input =
            document.createElement(
              "input"
            );

          input.type =
            "radio";

          input.name =
            "pm_" + index;

          input.value =
            value;

          if (
            savedResults[task] ===
            value
          ) {

            input.checked =
              true;
          }

          label.appendChild(
            input
          );

          label.appendChild(
            document.createTextNode(
              value === "PASS"
                ? "Pass"
                : value === "FAIL"
                ? "Fail"
                : "N/A"
            )
          );

          options.appendChild(
            label
          );
        }
      );

      row.appendChild(
        options
      );

      checklist.appendChild(
        row
      );
    }
  );

  status.textContent =
    "Complete each PM task before updating the Work Order.";
}

JFCustomWidget.subscribe(
  "ready",
  function(data) {

    savedResults =
      parseSaved(
        data && data.value
          ? data.value
          : ""
      );

JFCustomWidget.getFieldsValueById(["input_8", "input_63"], function(result) {

        const description =
          fieldValue(
            result,
            "8"
          );

        frequency =
          fieldValue(
            result,
            "63"
          );

        tasks =
          String(
            description || ""
          )
            .split(/\r?\n/)
            .map(cleanTask)
            .filter(Boolean);

        render();
      }
    );


    JFCustomWidget.subscribe(
      "submit",
      function() {

        const isImmediate =
          frequency
            .trim()
            .toLowerCase() ===
          "immediate wo";

        if (isImmediate) {

          JFCustomWidget.sendSubmit({
            valid: true,
            value: ""
          });

          return;
        }

        if (!tasks.length) {

          document.getElementById(
            "error"
          ).textContent =
            "No PM tasks were found.";

          JFCustomWidget.sendSubmit({
            valid: false,
            value: ""
          });

          return;
        }

        for (
          let i = 0;
          i < tasks.length;
          i++
        ) {

          const selected =
            document.querySelector(
              'input[name="pm_' +
              i +
              '"]:checked'
            );

          if (!selected) {

            document.getElementById(
              "error"
            ).textContent =
              "Select Pass, Fail, or N/A for every PM task.";

            JFCustomWidget.sendSubmit({
              valid: false,
              value: ""
            });

            return;
          }
        }

        JFCustomWidget.sendSubmit({
          valid: true,
          value: resultText()
        });
      }
    );
  }
);

</script>

</body>
</html>
