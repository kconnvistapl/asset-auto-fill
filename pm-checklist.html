<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #222;
  }

  .task {
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
  }

  .task-text {
    font-weight: 600;
    margin-bottom: 8px;
  }

  .options {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .options label {
    cursor: pointer;
    font-size: 14px;
  }

  .options input {
    margin-right: 5px;
  }

  .note {
    font-size: 13px;
    color: #555;
    padding: 8px 0;
  }

  #status {
    font-size: 12px;
    margin-top: 10px;
    color: #555;
  }

  #error {
    color: #b00020;
    font-size: 13px;
    font-weight: 600;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div id="checklist"></div>
<div id="status"></div>
<div id="error"></div>

<script>

let tasks = [];
let savedResults = {};

function cleanTask(value) {
  return String(value || "")
    .trim()
    .replace(/^[-•]\s*/, "")
    .replace(/^\d+[.)]\s*/, "")
    .trim();
}

function loadSavedValue(value) {

  const lines =
    String(value || "")
      .split(/\r?\n/)
      .map(function(line) {
        return line.trim();
      })
      .filter(Boolean);

  tasks = [];
  savedResults = {};

  lines.forEach(function(line) {

    const match =
      line.match(
        /^(PASS|FAIL|N\/A|NOT ANSWERED)\s*-\s*(.+)$/i
      );

    if (match) {

      const result =
        match[1].toUpperCase();

      const task =
        cleanTask(match[2]);

      if (task) {

        tasks.push(task);

        if (
          result !==
          "NOT ANSWERED"
        ) {
          savedResults[task] =
            result;
        }
      }

    } else {

      const task =
        cleanTask(line);

      if (task) {
        tasks.push(task);
      }
    }
  });

  tasks =
    tasks.filter(function(task, index) {
      return tasks.indexOf(task) === index;
    });
}

function resultText() {

  return tasks
    .map(function(task, index) {

      const selected =
        document.querySelector(
          'input[name="pm_' +
          index +
          '"]:checked'
        );

      return (
        selected
          ? selected.value
          : "NOT ANSWERED"
      ) +
      " - " +
      task;
    })
    .join("\n");
}

function render() {

  const checklist =
    document.getElementById(
      "checklist"
    );

  const status =
    document.getElementById(
      "status"
    );

  const error =
    document.getElementById(
      "error"
    );

  checklist.innerHTML = "";
  error.textContent = "";

  if (!tasks.length) {

    checklist.innerHTML =
      '<div class="note">' +
      'No PM checklist required for this work order.' +
      '</div>';

    status.textContent = "";

    return;
  }

  tasks.forEach(
    function(task, index) {

      const row =
        document.createElement(
          "div"
        );

      row.className = "task";

      const text =
        document.createElement(
          "div"
        );

      text.className =
        "task-text";

      text.textContent =
        task;

      row.appendChild(text);

      const options =
        document.createElement(
          "div"
        );

      options.className =
        "options";

      [
        "PASS",
        "FAIL",
        "N/A"
      ].forEach(
        function(value) {

          const label =
            document.createElement(
              "label"
            );

          const input =
            document.createElement(
              "input"
            );

          input.type = "radio";
          input.name =
            "pm_" + index;
          input.value = value;

          if (
            savedResults[task] ===
            value
          ) {
            input.checked = true;
          }

          input.addEventListener(
            "change",
            function() {

              error.textContent = "";

              JFCustomWidget.sendData({
                valid: true,
                value: resultText()
              });
            }
          );

          label.appendChild(input);

          label.appendChild(
            document.createTextNode(
              value === "PASS"
                ? "Pass"
                : value === "FAIL"
                ? "Fail"
                : "N/A"
            )
          );

          options.appendChild(label);
        }
      );

      row.appendChild(options);

      checklist.appendChild(row);
    }
  );

  status.textContent =
    "Complete each PM task before updating the Work Order.";
}

JFCustomWidget.subscribe(
  "ready",
  function(data) {

    loadSavedValue(
      data && data.value
        ? data.value
        : ""
    );

    render();

    JFCustomWidget.subscribe(
      "submit",
      function() {

        if (!tasks.length) {

          JFCustomWidget.sendSubmit({
            valid: true,
            value: ""
          });

          return;
        }

        for (
          let i = 0;
          i < tasks.length;
          i++
        ) {

          const selected =
            document.querySelector(
              'input[name="pm_' +
              i +
              '"]:checked'
            );

          if (!selected) {

            document.getElementById(
              "error"
            ).textContent =
              "Select Pass, Fail, or N/A for every PM task.";

            JFCustomWidget.sendSubmit({
              valid: false,
              value: resultText()
            });

            return;
          }
        }

        JFCustomWidget.sendSubmit({
          valid: true,
          value: resultText()
        });
      }
    );
  }
);

</script>

</body>
</html>
