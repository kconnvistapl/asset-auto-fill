<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

button {
  padding: 9px 14px;
  cursor: pointer;
  background: #1976d2;
  color: white;
  border: 0;
  border-radius: 4px;
}

#status {
  margin: 8px 0;
  font-size: 12px;
}

.task {
  padding: 10px 0;
  border-bottom: 1px solid #ddd;
}

.taskText {
  margin-bottom: 7px;
}

.options {
  display: flex;
  gap: 18px;
}

  
</style>
</head>

<body>

<button id="loadButton" type="button">
  Load PM Checklist
</button>

<div id="status">
  Click Load PM Checklist after the asset is selected.
</div>

<div id="checklist"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbwAitSILQYvKP-YgSvCUj8bIWel_07hIO7b8PGj9qo-DW6eRzOGVRVDy8w8rzZEbOEg8w/exec";

let tasks = [];


function jsonp(params, callback) {
  const script = document.createElement("script");

  params.callback = callback;

  script.src =
    API + "?" + new URLSearchParams(params);

  document.body.appendChild(script);
}


function getValue(data) {

  if (!data) return "";

  if (
    typeof data === "string" ||
    typeof data === "number"
  ) {
    return String(data);
  }

  if (Array.isArray(data)) {

    if (!data.length) return "";

    return getValue(data[0]);
  }

  if (typeof data === "object") {

    if (data.value !== undefined) {
      return String(data.value || "");
    }

    if (data.answer !== undefined) {
      return String(data.answer || "");
    }

    const keys = Object.keys(data);

    for (let i = 0; i < keys.length; i++) {

      const value =
        getValue(data[keys[i]]);

      if (value) return value;
    }
  }

  return "";
}


function escapeHtml(text) {
  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


function saveResults() {

  const results =
    tasks.map(function(task, index) {

      const selected =
        document.querySelector(
          'input[name="task_' +
          index +
          '"]:checked'
        );

      return (
        (
          selected
            ? selected.value
            : "NOT ANSWERED"
        ) +
        " - " +
        task
      );
    });

  const value =
    results.join("\n");

  JFCustomWidget.setFieldsValueByLabel([
    {
      label: "PM Checklist Results",
      value: value
    }
  ]);

  return value;
}


function renderChecklist(asset) {

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("checklist");

  if (!asset) {

    
    status.textContent =
      "Asset not found.";

    container.innerHTML = "";

    return;
  }

  const checklist =
    String(
      asset.pmChecklist || ""
    ).trim();

  if (checklist) {

    tasks =
      checklist
        .split(/\r?\n/)
        .map(function(task) {
          return task.trim();
        })
        .filter(Boolean);

  } else {

    tasks = [
      asset.description ||
      asset.assetName ||
      "PM Task"
    ];
  }


  let html =
    "<strong>PM Checklist</strong>";


  tasks.forEach(function(task, index) {

    html +=
      '<div class="task">' +

        '<div class="taskText">' +
          escapeHtml(task) +
        '</div>' +

        '<div class="options">' +

          '<label>' +
            '<input type="radio" ' +
            'name="task_' + index + '" ' +
            'value="PASS"> Pass' +
          '</label>' +

          '<label>' +
            '<input type="radio" ' +
            'name="task_' + index + '" ' +
            'value="FAIL"> Fail' +
          '</label>' +

          '<label>' +
            '<input type="radio" ' +
            'name="task_' + index + '" ' +
            'value="N/A"> N/A' +
          '</label>' +

        '</div>' +

      '</div>';
  });


  container.innerHTML = html;


  container
    .querySelectorAll(
      'input[type="radio"]'
    )
    .forEach(function(input) {

      input.addEventListener(
        "change",
        saveResults
      );
    });


  status.textContent =
    "Asset: " +
    (
      asset.assetName ||
      ""
    );


  JFCustomWidget.requestFrameResize({
    height:
      Math.max(
        180,
        document.body.scrollHeight + 20
      )
  });
}


window.pmDetailsCallback =
function(asset) {

  renderChecklist(asset);
};


JFCustomWidget.subscribe(
  "ready",
  function() {

    document
      .getElementById("loadButton")
      .addEventListener(
        "click",
        function() {

          const status =
            document.getElementById(
              "status"
            );

          status.textContent =
            "Reading asset...";


          JFCustomWidget.getFieldsValueById(
  ["q25_assetId"],
  function(data) {

              const assetId =
                getValue(data).trim();

              if (
                !assetId ||
                assetId.toLowerCase() ===
                "not assigned"
              ) {

                status.textContent =
                  "No asset assigned.";

                return;
              }


              status.textContent =
                "Loading checklist...";


              jsonp(
                {
                  action:
                    "assetDetails",

                  asset:
                    assetId
                },
                "pmDetailsCallback"
              );
            }
          );
        }
      );


    JFCustomWidget.subscribe(
      "submit",
      function() {

        const value =
          tasks.length
            ? saveResults()
            : "";

        JFCustomWidget.sendSubmit({
          valid: true,
          value: value
        });
      }
    );
  }
);

</script>

</body>
</html>
