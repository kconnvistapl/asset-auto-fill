<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  input {
    flex: 1;
    padding: 9px;
    font-size: 15px;
    box-sizing: border-box;
  }

  button {
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 4px;
  }

  #status {
    font-size: 12px;
    margin-top: 4px;
  }
</style>
</head>

<body>

<div class="row">
  <input
    id="assetSearch"
    list="assetList"
    placeholder="Start typing asset name"
  >

  <button id="fillButton" type="button">
    Auto Fill
  </button>
</div>

<datalist id="assetList"></datalist>

<div id="status"></div>
<div id="assetPreview"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbwAitSILQYvKP-YgSvCUj8bIWel_07hIO7b8PGj9qo-DW6eRzOGVRVDy8w8rzZEbOEg8w/exec";

let assets = [];

function jsonp(params, callback) {
  const script = document.createElement("script");

  params.callback = callback;

  script.src =
    API + "?" + new URLSearchParams(params);

  document.body.appendChild(script);
}

window.assetListCallback = function(list) {
  assets = list || [];

  const dl =
    document.getElementById("assetList");

  dl.innerHTML = "";

  assets.forEach(function(item) {
    const option =
      document.createElement("option");

    option.value = item;

    dl.appendChild(option);
  });
};

window.assetDetailsCallback = function(asset) {
  const status =
    document.getElementById("status");

  const preview =
    document.getElementById("assetPreview");

  if (!asset) {
    status.textContent = "Asset not found.";
    preview.innerHTML = "";
    return;
  }

  JFCustomWidget.setFieldsValueByLabel([
    { label: "Asset ID", value: asset.assetId || "" },
    { label: "Asset Name", value: asset.assetName || "" },
    { label: "Site", value: asset.site || "" },
    { label: "Department", value: asset.department || "" },
    { label: "Description of Work Needed", value: asset.description || "" },
    { label: "Serial Number", value: asset.serialNumber || "" },
    { label: "Model Number", value: asset.modelNumber || "" }
  ]);

  let html = "";

  if (asset.notes) {
    html +=
      `<div style="margin-top:12px;">
        <strong>Asset Notes:</strong><br>
        ${asset.notes}
      </div>`;
  }

  if (asset.photo) {
    try {
      const photoData =
        JSON.parse(asset.photo);

      const records =
        photoData.records || [];

      records.forEach(function(record) {
        const imageUrl =
          record.url.indexOf("http") === 0
            ? record.url
            : "https://www.jotform.com" + record.url;

        html +=
          `<div style="margin-top:12px;">
            <img
              src="${imageUrl}"
              style="max-width:100%; max-height:220px; border-radius:6px;"
            >

            ${
              record.note
                ? `<div style="margin-top:5px;">
                    <strong>Photo Note:</strong>
                    ${record.note}
                   </div>`
                : ""
            }
          </div>`;
      });

    } catch (e) {
      console.log(
        "Photo could not be displayed",
        e
      );
    }
  }

  preview.innerHTML = html;

  status.textContent =
    "Asset information filled.";
};

JFCustomWidget.subscribe(
  "ready",
  function() {

    jsonp(
      { action: "assetList" },
      "assetListCallback"
    );

    document
      .getElementById("fillButton")
      .addEventListener(
        "click",
        function() {

          const search =
            document.getElementById(
              "assetSearch"
            );

          const entered =
            search.value.trim();

          if (!entered) return;

          let selected =
            assets.find(function(item) {
              return (
                item.toLowerCase() ===
                entered.toLowerCase()
              );
            });

          if (!selected) {
            const matches =
              assets.filter(function(item) {
                return item
                  .toLowerCase()
                  .includes(
                    entered.toLowerCase()
                  );
              });

            if (matches.length === 1) {
              selected = matches[0];
              search.value = selected;
            }
          }

          if (!selected) {
            document.getElementById(
              "status"
            ).textContent =
              "Select an asset from the list.";

            return;
          }

          document.getElementById(
            "status"
          ).textContent =
            "Loading asset...";

          jsonp(
            {
              action: "assetDetails",
              asset: selected
            },
            "assetDetailsCallback"
          );
        }
      );

    JFCustomWidget.subscribe(
      "submit",
      function() {

        JFCustomWidget.sendSubmit({
          valid: true,
          value:
            document.getElementById(
              "assetSearch"
            ).value || ""
        });

      }
    );
  }
);

</script>

</body>
</html>
