<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>
<style>
  body { margin:0; font-family:Arial,sans-serif; }
  input { width:95%; padding:10px; font-size:16px; box-sizing:border-box; }
</style>
</head>

<body>

<input id="assetSearch" list="assetList" placeholder="Start typing asset name">
<datalist id="assetList"></datalist>

<script>
const API = "https://script.google.com/macros/s/AKfycbwAitSILQYvKP-YgSvCUj8bIWel_07hIO7b8PGj9qo-DW6eRzOGVRVDy8w8rzZEbOEg8w/exec";

let assets = [];

function jsonp(params, callback) {
  const script = document.createElement("script");
  params.callback = callback;
  script.src = API + "?" + new URLSearchParams(params);
  document.body.appendChild(script);
}

window.assetListCallback = function(list) {
  assets = list || [];

  const dl = document.getElementById("assetList");

  assets.forEach(function(asset) {
    const option = document.createElement("option");
    option.value = asset;
    dl.appendChild(option);
  });
};

window.assetDetailsCallback = function(asset) {
  if (!asset) return;

  JFCustomWidget.setFieldsValueByLabel([
    {label:"Asset ID", value:asset.assetId || ""},
    {label:"Asset Name", value:asset.assetName || ""},
    {label:"Site", value:asset.site || ""},
    {label:"Department", value:asset.department || ""},
    {label:"Description of Work Needed", value:asset.description || ""},
    {label:"Serial Number", value:asset.serialNumber || ""},
    {label:"Model Number", value:asset.modelNumber || ""}
  ]);
};

JFCustomWidget.subscribe("ready", function() {

  jsonp({action:"assetList"}, "assetListCallback");

  const search = document.getElementById("assetSearch");

  search.addEventListener("input", function() {

    const selected = assets.find(function(a) {
      return a.toLowerCase() === search.value.trim().toLowerCase();
    });

    if (selected) {
      jsonp(
        {action:"assetDetails", asset:selected},
        "assetDetailsCallback"
      );
    }
  });

  JFCustomWidget.subscribe("submit", function() {
    JFCustomWidget.sendSubmit({
      valid:true,
      value:search.value || ""
    });
  });

});
</script>

</body>
</html>
