<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    input {
      width: 95%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

<input
  id="assetSearch"
  list="assetList"
  placeholder="Start typing asset name"
>

<datalist id="assetList"></datalist>

<script>

const API =
  "https://script.google.com/macros/s/AKfycbwAitSILQYvKP-YgSvCUj8bIWel_07hIO7b8PGj9qo-DW6eRzOGVRVDy8w8rzZEbOEg8w/exec";

let assets = [];


/* --------------------------
   JSONP CALL
-------------------------- */

function jsonp(params, callback) {

  const script = document.createElement("script");

  params.callback = callback;

  script.src =
    API + "?" + new URLSearchParams(params);

  document.body.appendChild(script);
}


/* --------------------------
   LOAD ASSET LIST
-------------------------- */

window.assetListCallback = function(list) {

  assets = list || [];

  const dataList =
    document.getElementById("assetList");

  dataList.innerHTML = "";

  assets.forEach(function(item) {

    const option =
      document.createElement("option");

    option.value = item;

    dataList.appendChild(option);
  });
};


/* --------------------------
   FILL WORK ORDER
-------------------------- */

window.assetDetailsCallback = function(asset) {

  if (!asset) return;

  JFCustomWidget.setFieldsValueById([
    {
      id: "25",
      value: asset.assetId || ""
    },
    {
      id: "27",
      value: asset.assetName || ""
    },
    {
      id: "11",
      value: asset.site || ""
    },
    {
      id: "20",
      value: asset.department || ""
    },
    {
      id: "8",
      value: asset.description || ""
    },
    {
      id: "37",
      value: asset.serialNumber || ""
    },
    {
      id: "39",
      value: asset.modelNumber || ""
    }
  ]);
};


/* --------------------------
   JOTFORM READY
-------------------------- */

JFCustomWidget.subscribe(
  "ready",
  function() {

    jsonp(
      { action: "assetList" },
      "assetListCallback"
    );

    const search =
      document.getElementById("assetSearch");


    /* ----------------------
       ASSET SELECTED
    ---------------------- */

    search.addEventListener(
      "input",
      function() {

        const entered =
          search.value.trim().toLowerCase();

        const selected =
          assets.find(function(item) {
            return (
              item.toLowerCase() === entered
            );
          });

        if (!selected) return;

        jsonp(
          {
            action: "assetDetails",
            asset: selected
          },
          "assetDetailsCallback"
        );
      }
    );


    /* ----------------------
       FORM SUBMIT
    ---------------------- */

    JFCustomWidget.subscribe(
      "submit",
      function() {

        JFCustomWidget.sendSubmit({
          valid: true,
          value: search.value || ""
        });
      }
    );

  }
);

</script>

</body>
</html>
