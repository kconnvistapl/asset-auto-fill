<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  input {
    flex: 1;
    padding: 9px;
    font-size: 15px;
    box-sizing: border-box;
  }

  button {
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 4px;
  }

  #status {
    font-size: 12px;
    margin-top: 4px;
  }

  #maintenanceDetails {
    margin-top: 14px;
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 8px 10px;
  }

  #maintenanceDetails summary {
    font-weight: bold;
    cursor: pointer;
  }

  #checklistSection {
    margin-top: 10px;
  }

  .checklist-item {
    padding: 9px 0;
    border-bottom: 1px solid #ddd;
  }

  .checklist-task {
    margin-bottom: 6px;
  }

  .checklist-options {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .checklist-options label {
    font-size: 13px;
    cursor: pointer;
  }

  .checklist-options input {
    width: auto;
    margin-right: 4px;
  }
  
/* Hide duplicate checklist in Asset Auto Fill */
#maintenanceDetails > summary,
#checklistSection {
  display: none !important;
}

</style>
</head>

<body>

<div class="row">

<input
  id="assetSearch"
  list="assetList"
  placeholder="Start typing asset name"
  autocomplete="off"
  name="assetSearchCurrent"
  >

  <button
    id="fillButton"
    type="button"
  >
    Auto Fill
  </button>

</div>

<datalist id="assetList"></datalist>

<div id="status"></div>


<details
  id="maintenanceDetails"
  style="display:none;"
>

  <summary>
    Maintenance Use Only — PM Checklist
  </summary>

<div id="checklistSection"></div>

<div id="assetPreview"></div>

</details>


<script>

const API =
"https://script.google.com/macros/s/AKfycbwAitSILQYvKP-YgSvCUj8bIWel_07hIO7b8PGj9qo-DW6eRzOGVRVDy8w8rzZEbOEg8w/exec";


// Initialize state before Jotform callbacks run.
let assets = [];
let currentChecklistTasks = [];
let checklistTouched = false;
let isEditMode = false;
let savedAssetValue = "";
let lastPopulatedAssetSelection = "";

function displayAsset(item) {
  const parts = String(item || "").split(" — ");

  if (parts.length < 3) return item;

  const id = parts[0];
  const name = parts[1];
  const dc = parts[2];
  const sid = parts.find(p => p.startsWith("SID:"));

  return (
    name + " — " + dc + " — " + id +
    (sid ? " — " + sid : "")
  );
}

function jsonp(params, callback) {

  const script =
    document.createElement("script");
params.v = Date.now();
  params.callback =
    callback;

  script.src =
    API +
    "?" +
    new URLSearchParams(params);

  document.body.appendChild(script);
}


function escapeHtml(value) {

  return String(value || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


function clearChecklistResults() {

  JFCustomWidget.setFieldsValueByLabel([
    {
      label:
        "PM Checklist Results",

      value:
        ""
    }
  ]);
}


function saveChecklistResults() {

  if (!currentChecklistTasks.length) {
    return;
  }


  const lines =
    currentChecklistTasks.map(
      function(task, index) {

        const selected =
          document.querySelector(
            'input[name="checklist_' +
            index +
            '"]:checked'
          );


        const result =
          selected
            ? selected.value
            : "NOT ANSWERED";


        return (
          result +
          " - " +
          task
        );
      }
    );


  JFCustomWidget.setFieldsValueByLabel([
    {
      label:
        "PM Checklist Results",

      value:
        lines.join("\n")
    }
  ]);
}


function renderChecklist(asset) {

  const details =
    document.getElementById(
      "maintenanceDetails"
    );


  const section =
    document.getElementById(
      "checklistSection"
    );


  const source =
    (
      asset.pmChecklist ||
      ""
    ).trim();


let tasks =
  source
    ? source.split(/\r?\n/)
    : String(
        asset.description ||
        asset.assetName ||
        "PM Task"
      ).split(/\r?\n/);


  tasks =
    tasks
      .map(
        function(item) {
          return item.trim();
        }
      )
      .filter(Boolean);


  currentChecklistTasks =
    tasks;


  checklistTouched =
    false;


if (!isEditMode) {
  clearChecklistResults();
}


  if (!tasks.length) {

    details.style.display =
      "none";

    section.innerHTML =
      "";

    return;
  }


  let html =
    "";


  tasks.forEach(
    function(task, index) {

      html +=

        '<div class="checklist-item">' +

          '<div class="checklist-task">' +

            escapeHtml(task) +

          '</div>' +


          '<div class="checklist-options">' +


            '<label>' +

              '<input type="radio" ' +

              'name="checklist_' +
              index +
              '" ' +

              'value="PASS">' +

              'Pass' +

            '</label>' +


            '<label>' +

              '<input type="radio" ' +

              'name="checklist_' +
              index +
              '" ' +

              'value="FAIL">' +

              'Fail' +

            '</label>' +


            '<label>' +

              '<input type="radio" ' +

              'name="checklist_' +
              index +
              '" ' +

              'value="N/A">' +

              'N/A' +

            '</label>' +


          '</div>' +

        '</div>';
    }
  );


  section.innerHTML =
    html;


details.style.display =
  isEditMode ? "block" : "none";


  details.open =
    true;


  section
    .querySelectorAll(
      'input[type="radio"]'
    )
    .forEach(
      function(input) {

        input.addEventListener(
          "change",
          function() {

            checklistTouched =
              true;

            saveChecklistResults();
          }
        );
      }
    );
}


window.assetListCallback =
function(list) {

  assets =
    list ||
    [];
  
  const dl =
    document.getElementById(
      "assetList"
    );


  dl.innerHTML =
    "";


  assets.forEach(
    function(item) {

      const option =
        document.createElement(
          "option"
        );

option.value =
  displayAsset(item);

      dl.appendChild(
        option
      );
    }
  );
};


window.assetDetailsCallback =
function(asset) {

  const status =
    document.getElementById(
      "status"
    );


  const preview =
    document.getElementById(
      "assetPreview"
    );


  const details =
    document.getElementById(
      "maintenanceDetails"
    );


  if (!asset) {

    status.textContent =
      "Asset not found.";


    preview.innerHTML =
      "";


    details.style.display =
      "none";


    document.getElementById(
      "checklistSection"
    ).innerHTML =
      "";


    currentChecklistTasks =
      [];


    checklistTouched =
      false;


    clearChecklistResults();


    return;
  }


  JFCustomWidget.setFieldsValueByLabel([

    {
      label:
        "Asset ID",

      value:
        asset.assetId ||
        ""
    },

    {
      label:
        "Asset Name",

      value:
        asset.assetName ||
        ""
    },

    {
      label:
        "Site",

      value:
        asset.site ||
        ""
    },

    {
      label:
        "Department",

      value:
        asset.department ||
        ""
    },
{
  label: "Frequency",
  value: asset.frequency || ""
},
    {
      label:
        "Description of Work Needed",

      value:
        asset.description ||
        ""
    },

    {
      label:
        "Serial Number",

      value:
        asset.serialNumber ||
        ""
    },

    {
      label:
        "Model Number",

      value:
        asset.modelNumber ||
        ""
    }

  ]);

// MANUALS / PDF — separate from Image Upload

let manual = asset.manuals || "";

try {
  manual = JSON.parse(manual);
} catch (e) {}

if (Array.isArray(manual)) {
  manual = manual[0] || "";
}

const manualUrl =
  typeof manual === "string" &&
  /^https:\/\//i.test(manual)
    ? manual.trim()
    : "";

JFCustomWidget.setFieldsValueByLabel([
  {
    label: "Manuals / PDF's",
    value: manualUrl
  }
]);
  if (isEditMode) {

  renderChecklist(asset);

} else {

  details.style.display = "none";

  document.getElementById(
    "checklistSection"
  ).innerHTML = "";

  currentChecklistTasks = [];

  checklistTouched = false;
}


  let html =
    "";


  if (asset.notes) {

    html +=

      `<div style="margin-top:12px;">

        <strong>
          Asset Notes:
        </strong>

        <br>

        ${escapeHtml(asset.notes)}

      </div>`;
  }


  if (asset.photo) {

    try {

      const photoData =
        JSON.parse(
          asset.photo
        );


      const records =
        photoData.records ||
        [];


      records.forEach(
        function(record) {

          const imageUrl =

            record.url.indexOf(
              "http"
            ) === 0

              ? record.url

              : "https://www.jotform.com" +
                record.url;


          html +=

            `<div style="margin-top:12px;">

              <img
                src="${escapeHtml(imageUrl)}"
                style="
                  max-width:100%;
                  max-height:220px;
                  border-radius:6px;
                "
              >

              ${
                record.note

                  ? `<div style="margin-top:5px;">

                      <strong>
                        Photo Note:
                      </strong>

                      ${escapeHtml(record.note)}

                    </div>`

                  : ""
              }

            </div>`;
        }
      );


    } catch (e) {

      console.log(
        "Photo could not be displayed",
        e
      );
    }
  }


  preview.innerHTML =
    html;


lastPopulatedAssetSelection = document.getElementById("assetSearch").value.trim();
status.textContent = "Populated";
};


JFCustomWidget.subscribe(
  "ready",
function(data) {

isEditMode =
  !!(data && String(data.value || "").trim());

if (isEditMode) {

  const savedAsset =
    String(data.value).trim();

  savedAssetValue = savedAsset;

  document.getElementById(
    "assetSearch"
  ).value = savedAsset;

  jsonp(
    {
      action: "assetDetails",
      asset: savedAsset
    },
    "assetDetailsCallback"
  );
}


    jsonp(
      {
        action:
          "assetList"
      },

      "assetListCallback"
    );


    document
      .getElementById(
        "fillButton"
      )
      .addEventListener(
        "click",
        function() {


          const search =
            document.getElementById(
              "assetSearch"
            );


          const entered =
            search.value.trim();


          if (!entered) {
            return;
          }


let selected =
  assets.find(
    function(item) {
      return (
        displayAsset(item).toLowerCase() ===
        entered.toLowerCase()
      );
    }
  );


          if (!selected) {

            const matches =
              assets.filter(
                function(item) {

                  return item
                    .toLowerCase()
                    .includes(
                      entered.toLowerCase()
                    );
                }
              );


            if (
              matches.length ===
              1
            ) {

              selected =
                matches[0];


   search.value =
  displayAsset(selected);
            }
          }


          if (!selected) {

            document.getElementById(
              "status"
            ).textContent =
              "Select an asset from the list.";

            return;
          }

          // Already loaded on this existing work order: keep photo preview.
          if (isEditMode && selected === savedAssetValue) {
            document.getElementById("status").textContent = "Populated";
            return;
          }

          lastPopulatedAssetSelection = "";

          document.getElementById(
            "status"
          ).textContent =
            "Loading asset...";


          document.getElementById(
            "maintenanceDetails"
          ).style.display =
            "none";


          document.getElementById(
            "checklistSection"
          ).innerHTML =
            "";


          document.getElementById(
            "assetPreview"
          ).innerHTML =
            "";


          currentChecklistTasks =
            [];


          checklistTouched =
            false;


          jsonp(
            {
              action:
                "assetDetails",

              asset:
                selected
            },

            "assetDetailsCallback"
          );

        }
      );

    JFCustomWidget.subscribe(
      "submit",
      function() {
        // The separate PM Checklist widget enforces PASS/FAIL/N/A.
        // This widget checks that the work order keeps a real asset assignment.
        const entered = document.getElementById("assetSearch").value.trim();
        const selected = assets.find(function(item) {
          return displayAsset(item).toLowerCase() === entered.toLowerCase();
        });
        const unchangedExisting = isEditMode && entered === savedAssetValue;
        const notAssigned = /^Not Assigned(?:\s*[—-]\s*.*)?$/i.test(entered);
        const populated = Boolean(selected && entered === lastPopulatedAssetSelection);

        if (!unchangedExisting && !populated && !notAssigned) {
          document.getElementById("status").textContent =
            "Select an asset and click Auto Fill, or choose Not Assigned.";
          JFCustomWidget.sendSubmit({ valid: false, value: "" });
          return;
        }

        JFCustomWidget.sendSubmit({
          valid: true,
          value: unchangedExisting ? savedAssetValue : (selected || entered)
        });
      }
    );

  }
);

</script>

</body>
</html>
